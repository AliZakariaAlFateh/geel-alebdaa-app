<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدخال الدرجات — مدارس جيل الإبداع</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="dashboard">
  <header>
    <div>
      <h1 style="display:inline;">إدخال الدرجات</h1>
      <span class="user">
        مرحباً، <span id="user-name"></span>
        (<span id="role-badge"></span>)
      </span>
    </div>
    <div>
      <img src="Images/Logo_For_GeelEbdaa_School.png
          " width="100" height="70">
    </div>
    <div>
      <a href="index.html" class="btn btn-secondary" style="text-decoration:none;">الشهادات</a>
      <button class="btn btn-danger" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h3>اختر الفصل والمادة</h3>
      <div class="grid-3">
        <div class="form-group"><label>المرحلة</label><select id="stage" class="form-control"></select></div>
        <div class="form-group"><label>الصف</label><select id="grade" class="form-control"></select></div>
        <div class="form-group"><label>الفصل</label><select id="class" class="form-control"></select></div>
        <div class="form-group"><label>المادة</label><select id="subject" class="form-control"></select></div>
        <div class="form-group">
          <label>الترم</label>
          <select id="term" class="form-control">
            <option value="term1">الترم الأول</option>
            <option value="term2">الترم الثاني</option>
            <option value="final">النهائي</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;">قائمة الطلاب</h3>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="save-all-btn" class="btn">💾 حفظ الكل</button>
          <button id="print-btn" class="btn btn-secondary">🖨️ طباعة كل شهادات الفصل</button>
        </div>
      </div>
      <p class="muted" style="margin-top:8px;">
        💡 لطباعة شهادة طالب واحد فقط، اضغط زر <strong>"🖨️ شهادة الطالب"</strong> بجانب اسمه.
      </p>
      <div class="table-scroll">
        <div id="students-area"></div>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
</body>
</html>
