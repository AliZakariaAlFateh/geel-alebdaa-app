<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الشهادات — مدارس جيل الإبداع</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="certificates">
  <header>
    <div>
      <h1 style="display:inline;">عرض وطباعة الشهادات</h1>
      <span class="user">مرحباً، <span id="user-name"></span></span>
    </div>
    <div>
      <img src="Images/Logo_For_GeelEbdaa_School.png
          " width="100" height="70">
    </div>
    <div>
      <a href="dashboard.html" class="btn btn-secondary" style="text-decoration:none;">إدخال الدرجات</a>
      <a href="admin.html" class="btn btn-secondary" style="text-decoration:none;">لوحة التحكم</a>
      <button class="btn btn-danger" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h3>تصفية</h3>
      <div class="grid-3">
        <div class="form-group"><label>المرحلة</label><select id="f-stage" class="form-control"></select></div>
        <div class="form-group"><label>الصف</label><select id="f-grade" class="form-control"><option value="">الكل</option></select></div>
        <div class="form-group"><label>الفصل</label><select id="f-class" class="form-control"><option value="">الكل</option></select></div>
        <div class="form-group"><label>المادة</label><select id="f-subject" class="form-control"></select></div>
        <div class="form-group">
          <label>الترم</label>
          <select id="f-term" class="form-control">
            <option value="">الكل</option>
            <option value="term1">الترم الأول</option>
            <option value="term2">الترم الثاني</option>
            <option value="final">النهائي</option>
          </select>
        </div>
        <div style="display:flex; align-items:flex-end; gap:8px;">
          <button id="f-load" class="btn">عرض</button>
          <button id="f-print-all" class="btn btn-secondary">طباعة الكل</button>
        </div>
      </div>
    </div>

<div class="card">
  <div class="table-scroll">
    <table class="data-table">
      <thead>
        <tr>
          <th>الطالب</th><th>المرحلة</th><th>الصف</th>
          <th>الفصل</th><th>المادة</th><th>الدرجة</th><th></th>
        </tr>
      </thead>
      <tbody id="cert-tbody"></tbody>
    </table>
  </div>
</div>

  <div id="print-area"></div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
</body>
</html>
