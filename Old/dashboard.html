<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدخال الدرجات - مدارس جيل الإبداع</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>لوحة إدخال درجات الطلاب - مدارس جيل الإبداع بنين</h1>
    <div>
      <a href="index.html" class="btn btn-secondary" style="text-decoration: none; color: white;">عرض وقائمة الشهادات</a>
      <button onclick="logout()" class="btn btn-danger">خروج</button>
    </div>
  </header>

  <div class="container">
    <h3>تسجيل درجة طالب جديد</h3>
    <form id="add-grade-form">
      <div class="grid-3">
        <div class="form-group">
          <label>المرحلة الدراسية:</label>
          <select id="stage" class="form-control" onchange="updateGradesAndClasses()" required>
            <option value="">اختر المرحلة</option>
            <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
            <option value="المرحلة الثانوية">المرحلة الثانوية</option>
          </select>
        </div>

        <div class="form-group">
          <label>الصف الدراسي:</label>
          <select id="grade_level" class="form-control" onchange="updateClasses()" required>
            <option value="">اختر الصف</option>
          </select>
        </div>

        <div class="form-group">
          <label>الفصل:</label>
          <select id="class_name" class="form-control" required>
            <option value="">اختر الفصل</option>
          </select>
        </div>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>اسم الطالب الثلاثي:</label>
          <input type="text" id="student_name" class="form-control" placeholder="أحمد محمد علي" required>
        </div>

        <div class="form-group">
          <label>المادة:</label>
          <input type="text" id="subject" class="form-control" placeholder="تقنية رقمية" required>
        </div>

        <div class="form-group">
          <label>الدرجة:</label>
          <input type="number" id="score" class="form-control" min="0" max="100" placeholder="100" required>
        </div>
      </div>

      <button type="submit" class="btn">حفظ بيانات الطالب والدرجة</button>
    </form>
  </div>

  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script>
    // حماية الصفحة وإلزامية تسجيل الدخول
    getCurrentUser().then(user => {
      if (!user) window.location.href = 'login.html';
    });

    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
