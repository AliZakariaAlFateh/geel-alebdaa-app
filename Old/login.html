<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مدارس جيل الإبداع</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 100px;">
    <h2 style="text-align: center; color: var(--primary-color);">مدارس جيل الإبداع بنين</h2>
    <h3 style="text-align: center;">تسجيل الدخول للنظام</h3>
    
    <form id="login-form">
      <div class="form-group">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="email" class="form-control" required placeholder="admin@geel.edu.sa">
      </div>
      <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" style="width: 100%;">دخول</button>
    </form>
    <p id="error-msg" style="color: red; text-align: center; margin-top: 15px;"></p>
  </div>

  <script src="supabase-config.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      errorMsg.textContent = '';

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'خطأ في بيانات الدخول: ' + error.message;
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
