<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعراض وطباعة الشهادات - مدارس جيل الإبداع</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="print.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="no-print">
    <h1>نظام طباعة الشهادات - مدارس جيل الإبداع بنين بمكة المكرمة</h1>
    <div>
      <a href="dashboard.html" class="btn" style="text-decoration: none; color: white;">إدخال درجات جديدة</a>
    </div>
  </header>

  <div class="container no-print">
    <h3>تصفية واستعراض الشهادات حسب الفصل والمادة</h3>
    <div class="grid-3">
      <div class="form-group">
        <label>المرحلة:</label>
        <select id="filter-stage" class="form-control" onchange="updateFilterGradesAndClasses()">
          <option value="">الكل</option>
          <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
          <option value="المرحلة الثانوية">المرحلة الثانوية</option>
        </select>
      </div>

      <div class="form-group">
        <label>الصف:</label>
        <select id="filter-grade" class="form-control" onchange="updateFilterClasses()">
          <option value="">الكل</option>
        </select>
      </div>

      <div class="form-group">
        <label>الفصل:</label>
        <select id="filter-class" class="form-control">
          <option value="">الكل</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>المادة:</label>
        <input type="text" id="filter-subject" class="form-control" placeholder="بحث بالمادة (مثلاً: تقنية رقمية)">
      </div>
      <div class="form-group" style="display: flex; align-items: flex-end; gap: 10px;">
        <button onclick="fetchAndRenderGrades()" class="btn">عرض الطلاب</button>
        <button onclick="printAllFilteredCertificates()" class="btn btn-secondary">طباعة شهادات الفصل كاملاً (PDF)</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>اسم الطالب</th>
          <th>المرحلة</th>
          <th>الصف</th>
          <th>الفصل</th>
          <th>المادة</th>
          <th>الدرجة</th>
          <th>الخيارات</th>
        </tr>
      </thead>
      <tbody id="students-table-body">
        <!-- يتم تحميل البيانات بالـ JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- منطقة تجهيز وطباعة الشهادة (PDF) -->
  <div id="certificate-print-area"></div>

  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
  <script>
    // تحميل البيانات فور فتح الصفحة
    window.onload = () => {
      fetchAndRenderGrades();
    };
  </script>
</body>
</html>
